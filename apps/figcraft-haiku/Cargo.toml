[package]
name = "figcraft-haiku"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "FigCraft with native air/OS windows and platform services"

[[bin]]
name = "FigCraft"
path = "src/main.rs"

[target.'cfg(target_os = "haiku")'.dependencies]
rustix = { version = "1", default-features = false, features = ["std","fs"] }
figcraft-engine.workspace = true
figcraft-ui-egui.workspace = true
figcraft-collab-net.workspace = true
figcraft-render.workspace = true
figcraft-format.workspace = true
figcraft-text.workspace = true
egui.workspace = true
rayon = "1"
accesskit_consumer = "0.39.2"
serde_json.workspace = true
image.workspace = true
log.workspace = true
env_logger = { version = "0.11", default-features = false }
wgpu = { version = "30", default-features = false, features = ["std", "wgsl", "vulkan"] }
egui-wgpu = { version = "0.37", default-features = false }
# The raw Vulkan device, to import the screen's frame buffer (src/scanout.rs); the version wgpu-hal uses.
ash = "0.38"
pollster = "1"

[build-dependencies]
cc = "1"
